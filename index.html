<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <title>فرم حضور کارآموزی</title>
    <link
      href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/jalaali-js@1.2.6/dist/jalaali.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      :root {
        --bg: #1c1730;
        --bg2: #241e3d;
        --bg3: #2c2550;
        --card: rgba(36, 30, 61, 0.93);
        --p: #a78bfa;
        --p2: #c4b5fd;
        --p3: #7c3aed;
        --p4: #6d28d9;
        --t: #ede9fe;
        --t2: #a8a0c4;
        --t3: #6e6890;
        --brd: rgba(167, 139, 250, 0.18);
        --brd2: rgba(167, 139, 250, 0.3);
        --ok: #6ee7b7;
        --err: #fca5a5;
        --warn: #fcd34d;
        --r: 8px;
        --f: 'Vazirmatn', system-ui, sans-serif;
      }
      body {
        font-family: var(--f);
        background: linear-gradient(140deg, #161229, #1c1730, #221e3a);
        color: var(--t);
        min-height: 100vh;
        line-height: 1.6;
      }
      .wrap {
        max-width: 900px;
        margin: 0 auto;
        padding: 16px 12px;
      }

      /* ===== HEADER ===== */
      .hdr {
        text-align: center;
        padding: 18px 16px;
        margin-bottom: 12px;
        background: var(--card);
        border: 1px solid var(--brd);
        border-radius: 12px;
        position: relative;
        overflow: hidden;
      }
      .hdr::before {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 2px;
        background: linear-gradient(
          90deg,
          transparent,
          var(--p),
          var(--p2),
          var(--p),
          transparent
        );
      }
      .hdr h1 {
        font-size: 1.25em;
        font-weight: 800;
        color: var(--p2);
      }
      .hdr p {
        font-size: 0.8em;
        color: var(--t2);
        margin-top: 2px;
      }

      /* ===== CARD ===== */
      .cd {
        background: var(--card);
        border: 1px solid var(--brd);
        border-radius: 10px;
        padding: 14px;
        margin-bottom: 12px;
      }
      .cd-t {
        font-size: 0.92em;
        font-weight: 700;
        color: var(--p2);
        margin-bottom: 10px;
        padding-bottom: 7px;
        border-bottom: 1px solid var(--brd);
        display: flex;
        align-items: center;
        gap: 6px;
      }

      /* ===== INFO FORM ===== */
      .fg {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
        gap: 7px;
      }
      .fw {
        display: flex;
        flex-direction: column;
        gap: 2px;
      }
      .fw label {
        font-size: 0.75em;
        font-weight: 600;
        color: var(--t2);
        display: flex;
        align-items: center;
        gap: 4px;
      }
      .fw .pt {
        width: 13px;
        height: 13px;
        accent-color: var(--p);
        cursor: pointer;
      }
      .fi {
        background: rgba(28, 23, 48, 0.8);
        border: 1px solid var(--brd);
        border-radius: var(--r);
        padding: 6px 9px;
        color: var(--t);
        font-family: var(--f);
        font-size: 0.85em;
        outline: none;
        width: 100%;
      }
      .fi:focus {
        border-color: var(--p);
        box-shadow: 0 0 0 2px rgba(167, 139, 250, 0.12);
      }
      .fi::placeholder {
        color: var(--t3);
      }

      /* ===== SETTINGS ===== */
      .tgs {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
      }
      .tg {
        display: flex;
        align-items: center;
        gap: 5px;
        cursor: pointer;
        font-size: 0.78em;
        color: var(--t2);
      }
      .tg input {
        accent-color: var(--p);
        width: 14px;
        height: 14px;
      }

      /* ===== PAGE CONTAINER ===== */
      .page {
        background: var(--card);
        border: 1px solid var(--brd);
        border-radius: 10px;
        padding: 14px;
        margin-bottom: 12px;
      }
      .page-t {
        font-size: 0.85em;
        font-weight: 700;
        color: var(--p2);
        margin-bottom: 8px;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      .page-t span {
        font-size: 0.75em;
        color: var(--t3);
        font-weight: 400;
      }

      /* ===== TABLE ===== */
      .tw {
        overflow-x: auto;
        border-radius: var(--r);
        border: 1px solid var(--brd);
      }
      table {
        width: 100%;
        border-collapse: collapse;
        font-size: 0.8em;
        min-width: 680px;
      }
      thead th {
        background: rgba(124, 58, 237, 0.15);
        color: var(--p2);
        font-weight: 700;
        padding: 6px 3px;
        text-align: center;
        border-bottom: 2px solid var(--p4);
        font-size: 0.75em;
        white-space: nowrap;
      }
      tbody td {
        padding: 2px 2px;
        text-align: center;
        border-bottom: 1px solid rgba(167, 139, 250, 0.06);
        vertical-align: middle;
      }
      tbody tr:nth-child(even) {
        background: rgba(167, 139, 250, 0.02);
      }
      tbody .fi {
        border: none;
        background: transparent;
        text-align: center;
        padding: 4px 2px;
        font-size: 0.82em;
      }
      tbody .fi:focus {
        background: rgba(28, 23, 48, 0.5);
        border: 1px solid var(--p);
      }
      .rn {
        background: rgba(167, 139, 250, 0.12);
        color: var(--p2);
        font-weight: 700;
        width: 22px;
        height: 22px;
        border-radius: 50%;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        font-size: 0.72em;
      }
      .dur {
        font-weight: 700;
        color: var(--ok);
        font-size: 0.85em;
        direction: ltr;
      }
      .day {
        font-size: 0.68em;
        padding: 1px 4px;
        border-radius: 3px;
        white-space: nowrap;
      }
      .day-n {
        background: rgba(167, 139, 250, 0.08);
        color: var(--p2);
      }
      .day-e {
        background: rgba(252, 211, 77, 0.08);
        color: var(--warn);
      }
      .day-f {
        background: rgba(252, 165, 165, 0.08);
        color: var(--err);
      }
      .desc-fi {
        text-align: right !important;
        font-size: 0.76em !important;
      }

      /* Date cell */
      .date-cell {
        position: relative;
      }
      .date-cell .fi {
        min-width: 80px;
      }
      .dc-today {
        padding: 2px 5px;
        font-size: 0.6em;
        background: rgba(167, 139, 250, 0.1);
        border: 1px solid var(--brd);
        color: var(--p2);
        border-radius: 4px;
        cursor: pointer;
        font-family: var(--f);
        margin-top: 1px;
      }
      .dc-today:hover {
        background: var(--p3);
        color: #fff;
      }

      /* ===== CALENDAR POPUP ===== */
      .cal-wrap {
        position: absolute;
        top: 100%;
        right: 0;
        z-index: 100;
        display: none;
        background: var(--bg2);
        border: 1px solid var(--brd2);
        border-radius: var(--r);
        padding: 8px;
        box-shadow: 0 8px 30px rgba(0, 0, 0, 0.5);
        min-width: 240px;
      }
      .cal-wrap.show {
        display: block;
      }
      .cal-nav {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 6px;
      }
      .cal-nav button {
        background: none;
        border: none;
        color: var(--p);
        cursor: pointer;
        font-size: 1em;
        padding: 2px 6px;
        border-radius: 4px;
        font-family: var(--f);
      }
      .cal-nav button:hover {
        background: rgba(167, 139, 250, 0.15);
      }
      .cal-nav span {
        font-size: 0.8em;
        font-weight: 700;
        color: var(--t);
      }
      .cal-grid {
        display: grid;
        grid-template-columns: repeat(7, 1fr);
        gap: 2px;
        text-align: center;
      }
      .cal-grid .ch {
        font-size: 0.6em;
        color: var(--t3);
        font-weight: 700;
        padding: 2px;
      }
      .cal-grid .cd-btn {
        background: none;
        border: none;
        color: var(--t);
        cursor: pointer;
        padding: 4px 2px;
        border-radius: 4px;
        font-size: 0.75em;
        font-family: var(--f);
      }
      .cal-grid .cd-btn:hover {
        background: rgba(167, 139, 250, 0.15);
      }
      .cal-grid .cd-btn.today {
        border: 1px solid var(--p);
        color: var(--p2);
      }
      .cal-grid .cd-btn.selected {
        background: var(--p3);
        color: #fff;
      }
      .cal-grid .cd-btn.off {
        color: var(--t3);
        opacity: 0.4;
      }

      /* ===== SIGNATURES SECTION ===== */
      .sigs {
        margin-top: 8px;
        border: 1px solid var(--brd);
        border-radius: var(--r);
        padding: 8px;
      }
      .sigs-t {
        font-size: 0.78em;
        font-weight: 700;
        color: var(--t2);
        margin-bottom: 6px;
      }
      .sig-row {
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 3px 0;
        border-bottom: 1px solid rgba(167, 139, 250, 0.05);
        flex-wrap: wrap;
      }
      .sig-row:last-child {
        border-bottom: none;
      }
      .sig-rn {
        font-size: 0.7em;
        color: var(--t3);
        min-width: 30px;
      }
      .sig-name {
        flex: 1;
        min-width: 80px;
      }
      .sig-name input {
        font-size: 0.75em;
        padding: 3px 6px;
      }
      .sig-box {
        width: 72px;
        height: 40px;
        border: 1px dashed var(--brd);
        border-radius: 4px;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        background: rgba(255, 255, 255, 0.02);
        flex-shrink: 0;
      }
      .sig-box:hover {
        border-color: var(--p);
      }
      .sig-box img {
        max-width: 100%;
        max-height: 100%;
        object-fit: contain;
      }
      .sig-box .sph {
        font-size: 0.55em;
        color: var(--t3);
      }
      .sig-name2 {
        flex: 1;
        min-width: 80px;
      }
      .sig-box2 {
        width: 72px;
        height: 40px;
        border: 1px dashed var(--brd);
        border-radius: 4px;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        background: rgba(255, 255, 255, 0.02);
        flex-shrink: 0;
      }
      .sig-box2:hover {
        border-color: var(--p);
      }
      .sig-box2 img {
        max-width: 100%;
        max-height: 100%;
        object-fit: contain;
      }
      .sig-box2 .sph {
        font-size: 0.55em;
        color: var(--t3);
      }

      /* ===== EXTRA NOTES ===== */
      .xnotes {
        margin-top: 6px;
        border: 1px solid var(--brd);
        border-radius: var(--r);
        padding: 6px;
      }
      .xnotes-t {
        font-size: 0.72em;
        font-weight: 700;
        color: var(--t3);
        margin-bottom: 4px;
      }
      .xn-row {
        display: flex;
        gap: 4px;
        align-items: flex-start;
        margin-bottom: 3px;
      }
      .xn-row .xn-rn {
        font-size: 0.65em;
        color: var(--t3);
        min-width: 28px;
        padding-top: 4px;
      }
      .xn-row textarea {
        flex: 1;
        font-size: 0.72em;
        padding: 3px 6px;
        min-height: 28px;
        max-height: 50px;
        resize: vertical;
      }

      /* ===== SUMMARY ===== */
      .sum {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin-top: 8px;
        justify-content: center;
      }
      .sum-i {
        padding: 6px 14px;
        background: rgba(167, 139, 250, 0.05);
        border: 1px solid var(--brd);
        border-radius: var(--r);
        text-align: center;
      }
      .sum-i .sl {
        font-size: 0.68em;
        color: var(--t2);
      }
      .sum-i .sv {
        font-size: 1em;
        font-weight: 800;
        color: var(--p2);
        direction: ltr;
      }

      /* ===== BUTTONS ===== */
      .bt {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        padding: 8px 16px;
        border: none;
        border-radius: var(--r);
        font-family: var(--f);
        font-size: 0.82em;
        font-weight: 700;
        cursor: pointer;
        transition: all 0.2s;
      }
      .bt-p {
        background: linear-gradient(135deg, var(--p3), var(--p));
        color: #fff;
      }
      .bt-p:hover {
        transform: translateY(-1px);
        box-shadow: 0 3px 12px rgba(124, 58, 237, 0.25);
      }
      .bt-s {
        background: rgba(167, 139, 250, 0.07);
        color: var(--t);
        border: 1px solid var(--brd);
      }
      .bt-s:hover {
        background: rgba(167, 139, 250, 0.13);
      }
      .bt-er {
        background: rgba(252, 165, 165, 0.08);
        color: var(--err);
        border: 1px solid rgba(252, 165, 165, 0.15);
      }
      .bt-sm {
        padding: 5px 10px;
        font-size: 0.75em;
      }
      .acts {
        display: flex;
        flex-wrap: wrap;
        gap: 7px;
        margin-top: 12px;
        justify-content: center;
      }

      /* ===== SIGN MODAL ===== */
      .mo {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.82);
        z-index: 1000;
        display: none;
        align-items: center;
        justify-content: center;
        padding: 14px;
      }
      .mo.sh {
        display: flex;
      }
      .mo-c {
        background: var(--bg2);
        border: 1px solid var(--brd2);
        border-radius: 10px;
        padding: 16px;
        max-width: 440px;
        width: 100%;
      }
      .mo-c h3 {
        color: var(--p2);
        margin-bottom: 6px;
        font-size: 0.95em;
      }
      .mo-c p {
        color: var(--t3);
        font-size: 0.75em;
        margin-bottom: 6px;
      }
      .mo-cw {
        width: 100%;
        aspect-ratio: 5/2;
        border: 2px solid var(--brd);
        border-radius: var(--r);
        background: #fff;
        position: relative;
        touch-action: none;
        cursor: crosshair;
        overflow: hidden;
      }
      .mo-cw canvas {
        position: absolute;
        top: 0;
        left: 0;
      }
      .mo-a {
        display: flex;
        gap: 6px;
        justify-content: flex-end;
        margin-top: 8px;
      }

      /* ===== TOAST ===== */
      .tw-t {
        position: fixed;
        top: 10px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 9999;
        width: 85%;
        max-width: 320px;
      }
      .tst {
        padding: 8px 14px;
        border-radius: var(--r);
        font-size: 0.8em;
        font-weight: 600;
        font-family: var(--f);
        text-align: center;
        background: rgba(109, 40, 217, 0.9);
        color: #fff;
        animation:
          tin 0.25s,
          tout 0.25s 2.5s forwards;
      }
      @keyframes tin {
        from {
          opacity: 0;
          transform: translateY(-8px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      @keyframes tout {
        from {
          opacity: 1;
        }
        to {
          opacity: 0;
        }
      }

      /* ============ PRINT ============ */
      @media print {
        * {
          color: #000 !important;
          background: #fff !important;
          box-shadow: none !important;
          -webkit-text-fill-color: #000 !important;
          border-color: #bbb !important;
          text-shadow: none !important;
        }
        body {
          font-size: 9pt;
          line-height: 1.2;
          margin: 0;
          padding: 0;
        }

        .no-print,
        .acts,
        .tgs,
        .tw-t,
        .mo,
        .dc-today,
        .pt,
        .cal-wrap,
        #settingsCard,
        .hdr p {
          display: none !important;
        }

        .wrap {
          max-width: 100%;
          padding: 0;
          margin: 0;
        }

        .hdr {
          border: 2px solid #000;
          border-radius: 0;
          padding: 5px 8px;
          margin-bottom: 3px;
        }
        .hdr::before {
          display: none;
        }
        .hdr h1 {
          font-size: 12pt;
        }

        /* Info */
        .cd {
          border: 1.5px solid #000;
          border-radius: 0;
          padding: 4px 6px;
          margin-bottom: 2px;
        }
        .cd-t {
          font-size: 8.5pt;
          border-bottom: 1px solid #000;
          padding-bottom: 2px;
          margin-bottom: 4px;
        }
        .fw.no-pdf {
          display: none !important;
        }
        .fw.empty-opt {
          display: none !important;
        }
        .fg {
          grid-template-columns: repeat(4, 1fr);
          gap: 2px;
        }
        .fw label {
          font-size: 6pt;
        }
        .fi {
          border: none !important;
          padding: 0 2px !important;
          font-size: 8pt !important;
          background: transparent !important;
        }
        .fi::placeholder {
          color: transparent !important;
        }

        /* Pages */
        .page {
          border: none;
          border-radius: 0;
          padding: 0;
          margin-bottom: 0;
          page-break-after: always;
          page-break-inside: avoid;
        }
        .page:last-child {
          page-break-after: auto;
        }
        .page-t {
          font-size: 8pt;
          margin-bottom: 2px;
          padding: 2px 0;
          border-bottom: 1px solid #ccc;
        }
        .page-t span {
          font-size: 7pt;
        }

        /* Table */
        .tw {
          border: 1.5px solid #000;
          border-radius: 0;
          overflow: visible;
        }
        table {
          min-width: auto !important;
          font-size: 7.5pt;
        }
        thead {
          display: table-header-group;
        }
        thead th {
          background: #eee !important;
          color: #000 !important;
          border-bottom: 1.5px solid #000 !important;
          padding: 3px 2px;
          font-size: 6.5pt;
        }
        tbody td {
          padding: 1px 1px;
          border-bottom: 1px solid #ccc !important;
        }
        tbody .fi {
          font-size: 7pt !important;
          padding: 1px !important;
          border: none !important;
        }
        .rn {
          background: #e0e0e0 !important;
          color: #000 !important;
          width: 16px;
          height: 16px;
          font-size: 0.6em;
        }
        .dur {
          color: #000 !important;
        }
        .day {
          font-size: 0.5em;
          border: none !important;
        }
        .desc-fi {
          font-size: 6.5pt !important;
        }

        /* Signatures */
        .sigs {
          border: 1px solid #999;
          padding: 4px;
          margin-top: 4px;
        }
        .sigs-t {
          font-size: 7pt;
          margin-bottom: 3px;
        }
        .sig-row {
          padding: 2px 0;
          gap: 4px;
          border-bottom: 1px solid #ddd !important;
        }
        .sig-rn {
          font-size: 6pt;
        }
        .sig-name input,
        .sig-name2 input {
          font-size: 6.5pt !important;
          border: none !important;
          padding: 1px !important;
        }
        .sig-box,
        .sig-box2 {
          width: 60px;
          height: 34px;
          border: 1px solid #aaa !important;
          background: #fff !important;
        }
        .sig-box img,
        .sig-box2 img {
          max-height: 30px;
        }

        /* Extra notes */
        .xnotes {
          border: 1px solid #999;
          padding: 3px;
          margin-top: 3px;
        }
        .xnotes-t {
          font-size: 6pt;
        }
        .xnotes.empty-xn {
          display: none !important;
        }
        .xn-row {
          margin-bottom: 1px;
          gap: 2px;
        }
        .xn-row .xn-rn {
          font-size: 5.5pt;
        }
        .xn-row textarea {
          font-size: 6pt !important;
          border: none !important;
          padding: 1px !important;
          min-height: 14px !important;
          max-height: 20px !important;
        }

        /* Summary */
        .sum {
          gap: 3px;
          margin-top: 3px;
        }
        .sum-i {
          padding: 2px 8px;
          border: 1px solid #aaa;
        }
        .sum-i .sl {
          font-size: 5.5pt;
        }
        .sum-i .sv {
          font-size: 8pt;
        }

        tr {
          page-break-inside: avoid;
        }
        @page {
          size: A4 portrait;
          margin: 7mm 6mm;
        }
      }

      @media (max-width: 600px) {
        .fg {
          grid-template-columns: 1fr;
        }
        .acts {
          flex-direction: column;
        }
        .acts .bt {
          width: 100%;
        }
        .sig-row {
          flex-direction: row;
          flex-wrap: wrap;
        }
      }
    </style>
  </head>
  <body>
    <div class="tw-t" id="TW"></div>

    <div class="wrap">
      <header class="hdr">
        <h1>📋 فرم حضور کارآموزی</h1>
        <p>ثبت ساعات حضور در کارگاه</p>
      </header>

      <!-- Info -->
      <div class="cd" id="infoCard">
        <div class="cd-t">👤 مشخصات کارآموز</div>
        <div class="fg">
          <div class="fw" data-k="name">
            <label
              ><input type="checkbox" class="pt no-print" checked /> نام و نام
              خانوادگی</label
            ><input class="fi" id="i_name" placeholder="نام" />
          </div>
          <div class="fw" data-k="sid">
            <label
              ><input type="checkbox" class="pt no-print" checked /> شماره
              دانشجویی</label
            ><input class="fi" id="i_sid" placeholder="شماره" />
          </div>
          <div class="fw" data-k="major">
            <label
              ><input type="checkbox" class="pt no-print" checked /> رشته</label
            ><input class="fi" id="i_major" placeholder="رشته" />
          </div>
          <div class="fw" data-k="uni">
            <label
              ><input type="checkbox" class="pt no-print" checked />
              دانشگاه</label
            ><input class="fi" id="i_uni" placeholder="دانشگاه" />
          </div>
          <div class="fw" data-k="comp">
            <label
              ><input type="checkbox" class="pt no-print" checked /> شرکت /
              کارگاه</label
            ><input class="fi" id="i_comp" placeholder="محل" />
          </div>
          <div class="fw" data-k="sup">
            <label
              ><input type="checkbox" class="pt no-print" checked />
              سرپرست</label
            ><input class="fi" id="i_sup" placeholder="سرپرست" />
          </div>
          <div class="fw" data-k="adv">
            <label
              ><input type="checkbox" class="pt no-print" checked /> استاد
              راهنما</label
            ><input class="fi" id="i_adv" placeholder="استاد" />
          </div>
          <div class="fw" data-k="period">
            <label
              ><input type="checkbox" class="pt no-print" checked /> دوره</label
            ><input class="fi" id="i_period" placeholder="دوره" />
          </div>
        </div>
      </div>

      <!-- Settings -->
      <div class="cd no-print" id="settingsCard">
        <div class="cd-t">⚙️ تنظیمات</div>
        <div class="tgs">
          <label class="tg"
            ><input type="checkbox" id="tXnotes" onchange="rebuildPages()" />
            توضیحات بیشتر</label
          >
          <label class="tg"
            ><input type="checkbox" id="tEmpty" checked /> ردیف‌های خالی در
            PDF</label
          >
        </div>
      </div>

      <!-- Pages container -->
      <div id="pagesWrap"></div>

      <!-- Actions -->
      <div class="acts no-print">
        <button class="bt bt-p" onclick="addPage()">
          ➕ افزودن ۸ ردیف (صفحه جدید)
        </button>
        <button class="bt bt-p" onclick="doPrint()">🖨️ ذخیره PDF / چاپ</button>
        <button class="bt bt-er bt-sm" onclick="clearAll()">
          🗑️ پاک کردن همه
        </button>
      </div>

      <!-- Global summary -->
      <div class="sum" id="gSum">
        <div class="sum-i">
          <span class="sl">کل روزها</span><br /><span class="sv" id="gD"
            >0</span
          >
        </div>
        <div class="sum-i">
          <span class="sl">کل ساعات</span><br /><span class="sv" id="gH"
            >00:00</span
          >
        </div>
        <div class="sum-i">
          <span class="sl">میانگین</span><br /><span class="sv" id="gA"
            >00:00</span
          >
        </div>
      </div>
    </div>

    <!-- Sign Modal -->
    <div class="mo" id="sigMo">
      <div class="mo-c">
        <h3>✍️ امضا</h3>
        <p>با انگشت یا ماوس امضا کنید</p>
        <div class="mo-cw" id="sCW"><canvas id="sCV"></canvas></div>
        <div class="mo-a">
          <button class="bt bt-s bt-sm" onclick="clrC()">پاک</button>
          <button class="bt bt-s bt-sm" onclick="clsMo()">انصراف</button>
          <button class="bt bt-p bt-sm" onclick="saveSig()">✅ تأیید</button>
        </div>
      </div>
    </div>

    <input
      type="file"
      id="sfIn"
      accept="image/*"
      style="display: none"
      onchange="onSF(event)"
    />

    <!-- بخش ۲ از ۲ - جاوااسکریپت در پیام بعدی -->
    <script>
      // ============ SHAMSI ============
      const DN = [
        'یکشنبه',
        'دوشنبه',
        'سه‌شنبه',
        'چهارشنبه',
        'پنجشنبه',
        'جمعه',
        'شنبه',
      ];
      const WD = ['شنبه', 'یکشنبه', 'دوشنبه', 'سه‌شنبه'];
      const MN = [
        'فروردین',
        'اردیبهشت',
        'خرداد',
        'تیر',
        'مرداد',
        'شهریور',
        'مهر',
        'آبان',
        'آذر',
        'دی',
        'بهمن',
        'اسفند',
      ];

      function todayJ() {
        const d = new Date(),
          j = jalaali.toJalaali(d.getFullYear(), d.getMonth() + 1, d.getDate());
        return {
          jy: j.jy,
          jm: j.jm,
          jd: j.jd,
          str:
            j.jy +
            '/' +
            String(j.jm).padStart(2, '0') +
            '/' +
            String(j.jd).padStart(2, '0'),
        };
      }

      function dayName(s) {
        if (!s || s.length < 10) return '';
        try {
          const p = s.split('/'),
            g = jalaali.toGregorian(+p[0], +p[1], +p[2]);
          return DN[new Date(g.gy, g.gm - 1, g.gd).getDay()];
        } catch (e) {
          return '';
        }
      }

      function jMonthLen(jy, jm) {
        if (jm <= 6) return 31;
        if (jm <= 11) return 30;
        return jalaali.isLeapJalaaliYear(jy) ? 30 : 29;
      }

      function jDayOfWeek(jy, jm, jd) {
        try {
          const g = jalaali.toGregorian(jy, jm, jd);
          return new Date(g.gy, g.gm - 1, g.gd).getDay();
        } catch (e) {
          return 0;
        }
      }

      // ============ TIME ============
      function t2m(t) {
        if (!t) return 0;
        const p = t.split(':');
        return (+p[0] || 0) * 60 + (+p[1] || 0);
      }
      function m2t(m) {
        m = Math.max(0, m);
        return (
          String(Math.floor(m / 60)).padStart(2, '0') +
          ':' +
          String(m % 60).padStart(2, '0')
        );
      }

      // ============ STATE ============
      let pageCount = 0,
        curSigEl = null,
        sCtx = null,
        drawing = false;

      // ============ BUILD PAGE ============
      function addPage() {
        pageCount++;
        const pgNum = pageCount;
        const showXN = document.getElementById('tXnotes').checked;

        const div = document.createElement('div');
        div.className = 'page';
        div.dataset.page = pgNum;

        let tableHTML = `
    <div class="page-t">صفحه ${pgNum} <span>ردیف ${(pgNum - 1) * 8 + 1} تا ${pgNum * 8}</span></div>
    <div class="tw"><table>
      <thead><tr>
        <th style="width:28px">#</th>
        <th style="width:100px">تاریخ</th>
        <th style="width:52px">روز</th>
        <th style="width:58px">شروع</th>
        <th style="width:58px">پایان</th>
        <th style="width:52px">مدت</th>
        <th style="width:80px">محل</th>
        <th style="width:100px">شرح کار</th>
      </tr></thead><tbody>`;

        for (let i = 0; i < 8; i++) {
          const rn = (pgNum - 1) * 8 + i + 1;
          tableHTML += `
      <tr data-rn="${rn}">
        <td><span class="rn">${rn}</span></td>
        <td class="date-cell">
          <input class="fi fd" placeholder="تاریخ" maxlength="10" oninput="onDI(this)" onfocus="showCal(this)">
          <button class="dc-today no-print" onclick="setTd(this)" type="button">امروز</button>
        </td>
        <td class="day-td"></td>
        <td><input type="time" class="fi fs" onchange="calc(this)"></td>
        <td><input type="time" class="fi fe" onchange="calc(this)"></td>
        <td><span class="dur" data-dur></span></td>
        <td><input class="fi floc" placeholder="محل"></td>
        <td><input class="fi desc-fi" placeholder="شرح"></td>
      </tr>`;
        }

        tableHTML += `</tbody></table></div>`;

        // Signatures section
        let sigsHTML = `<div class="sigs"><div class="sigs-t">امضاها</div>`;
        for (let i = 0; i < 8; i++) {
          const rn = (pgNum - 1) * 8 + i + 1;
          sigsHTML += `
      <div class="sig-row" data-srn="${rn}">
        <span class="sig-rn">ردیف ${rn}</span>
        <div class="sig-name"><input class="fi" placeholder="نام امضاکننده ۱"></div>
        <div class="sig-box" data-sig="" onclick="openSig(this)"><span class="sph">امضا</span></div>
        <div class="sig-name2"><input class="fi" placeholder="نام امضاکننده ۲"></div>
        <div class="sig-box2" data-sig="" onclick="openSig(this)"><span class="sph">امضا</span></div>
      </div>`;
        }
        sigsHTML += `</div>`;

        // Extra notes section
        let xnHTML = `<div class="xnotes${showXN ? '' : ' empty-xn'}" data-xn><div class="xnotes-t">توضیحات بیشتر</div>`;
        for (let i = 0; i < 8; i++) {
          const rn = (pgNum - 1) * 8 + i + 1;
          xnHTML += `
      <div class="xn-row" data-xrn="${rn}">
        <span class="xn-rn">ردیف ${rn}:</span>
        <textarea class="fi" placeholder="توضیحات ردیف ${rn}" rows="1"></textarea>
      </div>`;
        }
        xnHTML += `</div>`;

        // Summary for this page
        let sumHTML = `
    <div class="sum page-sum">
      <div class="sum-i"><span class="sl">روزهای این صفحه</span><br><span class="sv ps-d">0</span></div>
      <div class="sum-i"><span class="sl">ساعات این صفحه</span><br><span class="sv ps-h">00:00</span></div>
    </div>`;

        div.innerHTML = tableHTML + sigsHTML + xnHTML + sumHTML;
        document.getElementById('pagesWrap').appendChild(div);
        calcAll();
      }

      // ============ DATE INPUT ============
      function onDI(inp) {
        let v = inp.value;
        // Convert Persian digits
        v = v.replace(/[۰-۹]/g, (d) => {
          const persianDigits = '۰۱۲۳۴۵۶۷۸۹';
          return String(persianDigits.indexOf(d));
        });
        v = v.replace(/[^\d\/]/g, '');
        if (v.length === 4 && !v.includes('/')) v += '/';
        else if (v.length === 7 && v.split('/').length === 2) v += '/';
        if (v.length > 10) v = v.substring(0, 10);
        inp.value = v;
        if (v.length === 10) updateDay(inp);
        hideCal();
      }

      function setTd(btn) {
        const inp = btn.closest('.date-cell').querySelector('.fd');
        inp.value = todayJ().str;
        updateDay(inp);
        hideCal();
      }

      function updateDay(inp) {
        const tr = inp.closest('tr');
        const td = tr.querySelector('.day-td');
        const dn = dayName(inp.value);
        if (!dn) {
          td.innerHTML = '';
          return;
        }
        const iw = WD.includes(dn);
        if (dn === 'جمعه')
          td.innerHTML = `<span class="day day-f">${dn}</span>`;
        else if (!iw) td.innerHTML = `<span class="day day-e">${dn}</span>`;
        else td.innerHTML = `<span class="day day-n">${dn}</span>`;
      }

      // ============ CALENDAR ============
      let activeCal = null,
        calYear = 0,
        calMonth = 0;

      function showCal(inp) {
        hideCal();
        const cell = inp.closest('.date-cell');
        let wrap = cell.querySelector('.cal-wrap');
        if (!wrap) {
          wrap = document.createElement('div');
          wrap.className = 'cal-wrap';
          cell.appendChild(wrap);
        }

        // Determine initial year/month
        const v = inp.value;
        if (v && v.length === 10) {
          const p = v.split('/');
          calYear = +p[0];
          calMonth = +p[1];
        } else {
          const t = todayJ();
          calYear = t.jy;
          calMonth = t.jm;
        }

        activeCal = { wrap, inp };
        renderCal();
        wrap.classList.add('show');

        // Close on outside click
        setTimeout(() => {
          document.addEventListener('click', calOutside, { once: false });
        }, 50);
      }

      function hideCal() {
        if (activeCal) {
          activeCal.wrap.classList.remove('show');
          activeCal = null;
        }
        document.removeEventListener('click', calOutside);
      }

      function calOutside(e) {
        if (
          activeCal &&
          !activeCal.wrap.contains(e.target) &&
          e.target !== activeCal.inp
        ) {
          hideCal();
        }
      }

      function renderCal() {
        if (!activeCal) return;
        const w = activeCal.wrap;
        const t = todayJ();
        const sel = activeCal.inp.value;
        const mLen = jMonthLen(calYear, calMonth);

        // Day of week for 1st of month (Shamsi week starts Saturday=6 in JS)
        const firstDow = jDayOfWeek(calYear, calMonth, 1);
        // Convert to Shamsi week: Sat=0, Sun=1, ..., Fri=6
        const shamsiDow = (firstDow + 1) % 7;

        let html = `
    <div class="cal-nav">
      <button type="button" onclick="calPrev()">◀</button>
      <span>${MN[calMonth - 1]} ${calYear}</span>
      <button type="button" onclick="calNext()">▶</button>
    </div>
    <div class="cal-grid">
      <span class="ch">ش</span><span class="ch">ی</span><span class="ch">د</span>
      <span class="ch">س</span><span class="ch">چ</span><span class="ch">پ</span><span class="ch">ج</span>`;

        // Empty cells before 1st
        for (let i = 0; i < shamsiDow; i++) {
          html += `<span></span>`;
        }

        for (let d = 1; d <= mLen; d++) {
          const ds =
            calYear +
            '/' +
            String(calMonth).padStart(2, '0') +
            '/' +
            String(d).padStart(2, '0');
          const isToday = calYear === t.jy && calMonth === t.jm && d === t.jd;
          const isSel = ds === sel;
          let cls = 'cd-btn';
          if (isToday) cls += ' today';
          if (isSel) cls += ' selected';
          html += `<button type="button" class="${cls}" onclick="pickDate('${ds}')">${d}</button>`;
        }

        html += `</div>`;
        w.innerHTML = html;
      }

      function calPrev() {
        calMonth--;
        if (calMonth < 1) {
          calMonth = 12;
          calYear--;
        }
        renderCal();
      }

      function calNext() {
        calMonth++;
        if (calMonth > 12) {
          calMonth = 1;
          calYear++;
        }
        renderCal();
      }

      function pickDate(ds) {
        if (!activeCal) return;
        activeCal.inp.value = ds;
        updateDay(activeCal.inp);
        hideCal();
        calcAll();
      }

      // ============ TIME CALC ============
      function calc(inp) {
        const tr = inp.closest('tr');
        const s = tr.querySelector('.fs').value;
        const e = tr.querySelector('.fe').value;
        const d = tr.querySelector('[data-dur]');
        if (s && e) {
          const diff = t2m(e) - t2m(s);
          d.textContent = diff > 0 ? m2t(diff) : '00:00';
        } else d.textContent = '';
        calcAll();
      }

      function calcAll() {
        let gDays = 0,
          gMins = 0;

        document.querySelectorAll('.page').forEach((pg) => {
          let pDays = 0,
            pMins = 0;
          pg.querySelectorAll('tbody tr').forEach((tr) => {
            const s = tr.querySelector('.fs')?.value;
            const e = tr.querySelector('.fe')?.value;
            if (s && e) {
              const d = t2m(e) - t2m(s);
              if (d > 0) {
                pDays++;
                pMins += d;
              }
            }
          });
          const psd = pg.querySelector('.ps-d');
          const psh = pg.querySelector('.ps-h');
          if (psd) psd.textContent = pDays;
          if (psh) psh.textContent = m2t(pMins);
          gDays += pDays;
          gMins += pMins;
        });

        document.getElementById('gD').textContent = gDays;
        document.getElementById('gH').textContent = m2t(gMins);
        document.getElementById('gA').textContent = gDays
          ? m2t(Math.round(gMins / gDays))
          : '00:00';
      }

      // ============ TOGGLE EXTRA NOTES ============
      function rebuildPages() {
        const show = document.getElementById('tXnotes').checked;
        document.querySelectorAll('[data-xn]').forEach((el) => {
          el.classList.toggle('empty-xn', !show);
        });
      }

      // ============ SIGNATURE ============
      function openSig(box) {
        const hasSig = box.dataset.sig;
        if (hasSig) {
          if (confirm('امضا حذف شود؟')) {
            box.dataset.sig = '';
            box.innerHTML = '<span class="sph">امضا</span>';
          }
          return;
        }
        curSigEl = box;
        const choice = confirm('OK = امضای دستی\nCancel = آپلود عکس');
        if (choice) {
          openDraw();
        } else {
          document.getElementById('sfIn').click();
        }
      }

      function openDraw() {
        const mo = document.getElementById('sigMo');
        mo.classList.add('sh');
        const cv = document.getElementById('sCV'),
          cw = document.getElementById('sCW');
        requestAnimationFrame(() => {
          const r = cw.getBoundingClientRect();
          cv.width = r.width;
          cv.height = r.height;
          sCtx = cv.getContext('2d');
          sCtx.fillStyle = '#fff';
          sCtx.fillRect(0, 0, cv.width, cv.height);
          sCtx.strokeStyle = '#1c1730';
          sCtx.lineWidth = 2.5;
          sCtx.lineCap = 'round';
          sCtx.lineJoin = 'round';
          drawing = false;

          // Pointer events
          cv.onpointerdown = function (e) {
            drawing = true;
            const p = gp(e, cv);
            sCtx.beginPath();
            sCtx.moveTo(p.x, p.y);
            e.preventDefault();
          };
          cv.onpointermove = function (e) {
            if (!drawing) return;
            const p = gp(e, cv);
            sCtx.lineTo(p.x, p.y);
            sCtx.stroke();
            e.preventDefault();
          };
          cv.onpointerup = function () {
            drawing = false;
          };
          cv.onpointercancel = function () {
            drawing = false;
          };

          // Touch fallback
          cv.ontouchstart = function (e) {
            if (e.touches.length !== 1) return;
            e.preventDefault();
            drawing = true;
            const p = gp(e.touches[0], cv);
            sCtx.beginPath();
            sCtx.moveTo(p.x, p.y);
          };
          cv.ontouchmove = function (e) {
            if (!drawing || e.touches.length !== 1) return;
            e.preventDefault();
            const p = gp(e.touches[0], cv);
            sCtx.lineTo(p.x, p.y);
            sCtx.stroke();
          };
          cv.ontouchend = function () {
            drawing = false;
          };
        });
      }

      function gp(e, cv) {
        const r = cv.getBoundingClientRect();
        return {
          x: (e.clientX - r.left) * (cv.width / r.width),
          y: (e.clientY - r.top) * (cv.height / r.height),
        };
      }

      function clrC() {
        const cv = document.getElementById('sCV');
        if (sCtx) {
          sCtx.fillStyle = '#fff';
          sCtx.fillRect(0, 0, cv.width, cv.height);
        }
      }

      function saveSig() {
        const cv = document.getElementById('sCV');
        const du = cv.toDataURL('image/png');
        if (curSigEl) {
          curSigEl.dataset.sig = du;
          curSigEl.innerHTML = '<img src="' + du + '">';
        }
        clsMo();
        toast('امضا ثبت شد');
      }

      function onSF(e) {
        const f = e.target.files[0];
        if (!f) return;
        if (f.size > 5 * 1024 * 1024) {
          toast('حجم فایل زیاد!');
          e.target.value = '';
          return;
        }
        const r = new FileReader();
        r.onload = function (ev) {
          if (curSigEl) {
            curSigEl.dataset.sig = ev.target.result;
            curSigEl.innerHTML = '<img src="' + ev.target.result + '">';
          }
          toast('آپلود شد');
        };
        r.readAsDataURL(f);
        e.target.value = '';
      }

      function clsMo() {
        document.getElementById('sigMo').classList.remove('sh');
      }
      document.getElementById('sigMo').addEventListener('click', function (e) {
        if (e.target.id === 'sigMo') clsMo();
      });

      // ============ PRINT ============
      function doPrint() {
        const showEmpty = document.getElementById('tEmpty').checked;
        const showXN = document.getElementById('tXnotes').checked;

        // Handle empty rows
        if (!showEmpty) {
          document.querySelectorAll('#pagesWrap tbody tr').forEach((tr) => {
            const dt = tr.querySelector('.fd')?.value;
            const st = tr.querySelector('.fs')?.value;
            const en = tr.querySelector('.fe')?.value;
            if (!dt && !st && !en) tr.classList.add('no-print');
          });

          // Also hide corresponding sig rows and xn rows
          document
            .querySelectorAll('#pagesWrap tbody tr.no-print')
            .forEach((tr) => {
              const rn = tr.dataset.rn;
              const sigRow = document.querySelector(
                '.sig-row[data-srn="' + rn + '"]',
              );
              if (sigRow) sigRow.classList.add('no-print');
              const xnRow = document.querySelector(
                '.xn-row[data-xrn="' + rn + '"]',
              );
              if (xnRow) xnRow.classList.add('no-print');
            });
        }

        // Handle info field visibility
        document.querySelectorAll('.fw[data-k]').forEach((w) => {
          const cb = w.querySelector('.pt');
          if (cb && !cb.checked) w.classList.add('no-pdf');
          const inp = w.querySelector('.fi');
          if (inp && !inp.value.trim()) w.classList.add('empty-opt');
        });

        // Handle extra notes visibility
        if (!showXN) {
          document
            .querySelectorAll('[data-xn]')
            .forEach((el) => el.classList.add('empty-xn'));
        }

        // Do print
        window.print();

        // Restore everything
        setTimeout(function () {
          document
            .querySelectorAll('.no-print-temp,.no-print')
            .forEach((el) => {
              // Only remove from dynamic ones
            });
          document
            .querySelectorAll('#pagesWrap tbody tr')
            .forEach((tr) => tr.classList.remove('no-print'));
          document
            .querySelectorAll('.sig-row')
            .forEach((sr) => sr.classList.remove('no-print'));
          document
            .querySelectorAll('.xn-row')
            .forEach((xr) => xr.classList.remove('no-print'));
          document.querySelectorAll('.fw').forEach((w) => {
            w.classList.remove('no-pdf', 'empty-opt');
          });
          document.querySelectorAll('[data-xn]').forEach((el) => {
            el.classList.toggle(
              'empty-xn',
              !document.getElementById('tXnotes').checked,
            );
          });
        }, 800);
      }

      // ============ CLEAR ============
      function clearAll() {
        if (!confirm('همه داده‌ها پاک شود؟')) return;
        document.getElementById('pagesWrap').innerHTML = '';
        pageCount = 0;
        addPage();
        calcAll();
        toast('پاک شد');
      }

      // ============ TOAST ============
      function toast(m) {
        const c = document.getElementById('TW');
        const d = document.createElement('div');
        d.className = 'tst';
        d.textContent = '✅ ' + m;
        c.appendChild(d);
        setTimeout(function () {
          if (d.parentNode) d.remove();
        }, 3000);
      }

      // ============ INIT ============
      addPage(); // Start with 1 page (8 rows)
    </script>
  </body>
</html>
